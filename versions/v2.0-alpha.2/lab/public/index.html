<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsApp Alpha 2 Lab</title>
<style>
body{margin:0;background:#07100d;color:#eafff3;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1080px;margin:auto;padding:32px}
h1{font-size:34px;margin:0 0 6px}.muted{color:#8ba99a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}
.card{border:1px solid #224236;background:#0c1914;border-radius:14px;padding:16px}.label{font-size:10px;color:#87a596;text-transform:uppercase;letter-spacing:.08em}.value{font-size:18px;margin-top:7px;font-weight:800}
.ok{color:#72efa1}.warn{color:#ffd37b}.events{border:1px solid #224236;border-radius:14px;overflow:hidden}.event{display:grid;grid-template-columns:170px 1fr 120px;gap:12px;padding:12px 14px;border-top:1px solid #183127;font:12px ui-monospace,monospace}.event:first-child{border-top:0}
button{border:1px solid #33704f;background:#123521;color:#dffff0;padding:9px 12px;border-radius:9px;cursor:pointer}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.event{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><div class="muted">MCF ACADEMY · LABORATÓRIO</div><h1>WhatsApp Cloud API Lab</h1><div class="muted">Estado observável do backend Node.js + Express.</div></div><button id="simulate">Simular evento</button></div>
<div class="grid">
  <div class="card"><div class="label">Servidor</div><div class="value ok" id="server">ONLINE</div></div>
  <div class="card"><div class="label">Webhook verify</div><div class="value" id="verify">—</div></div>
  <div class="card"><div class="label">App Secret</div><div class="value" id="secret">—</div></div>
  <div class="card"><div class="label">Cloud API</div><div class="value" id="cloud">—</div></div>
</div>
<h2>Eventos</h2>
<div class="events" id="events"><div class="event"><span>—</span><span>Nenhum evento ainda.</span><span>aguardando</span></div></div>
</div>
<script>
async function refresh(){
 const r=await fetch('/api/status'); const s=await r.json();
 document.querySelector('#verify').textContent=s.verificationPassed?'PASS':'AGUARDANDO';
 document.querySelector('#verify').className='value '+(s.verificationPassed?'ok':'warn');
 document.querySelector('#secret').textContent=s.config.appSecretConfigured?'CONFIGURADO':'OPCIONAL';
 document.querySelector('#secret').className='value '+(s.config.appSecretConfigured?'ok':'warn');
 const cloud=s.config.accessTokenConfigured&&s.config.phoneNumberIdConfigured;
 document.querySelector('#cloud').textContent=cloud?'CONFIGURADA':'NÃO CONFIGURADA';
 document.querySelector('#cloud').className='value '+(cloud?'ok':'warn');
 const box=document.querySelector('#events');
 box.innerHTML=s.events.length?s.events.map(e=>`<div class="event"><span>${e.at||''}</span><span>${e.type||''}</span><span>${e.status||'RECEBIDO'}</span></div>`).join(''):'<div class="event"><span>—</span><span>Nenhum evento ainda.</span><span>aguardando</span></div>';
}
document.querySelector('#simulate').addEventListener('click',async()=>{await fetch('/api/test-event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'message.received'})});refresh()});
refresh();setInterval(refresh,2000);
</script></body></html>
